version: '3.9'

services:
  # 1. PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: anveshan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: anveshan_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anveshan_research"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anveshan-net

  # 2. FastAPI Backend Service (Python 3.11 + LangGraph + Vertex AI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anveshan-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=Anveshan Research AI
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/anveshan_research
      - DATABASE_SYNC_URL=postgresql://postgres:postgrespassword@db:5432/anveshan_research
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_REGION=${GCP_REGION:-us-central1}
      - PORT=8080
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anveshan-net

  # 3. Next.js Frontend Web App (App Router + React Flow)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: anveshan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - anveshan-net

networks:
  anveshan-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
